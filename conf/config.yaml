project:
  name: customer-churn-mlops
  environment: development

data:
  path: data/customer_churn.csv
  target_column: Churn
  feature_columns:
    - tenure
    - MonthlyCharges
    - TotalCharges

training:
  model_type: LogisticRegression
  test_size: 0.2
  random_state: 42
  max_iter: 1000

mlflow:
  experiment_name: /Shared/customer-churn-experiment
  model_name: customer_churn_model
